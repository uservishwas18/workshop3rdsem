<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String</title>
</head>

<body>

<script>
    let a = "Yash<br>";
    let result = "RRR";

    for (let i = 0; i < a.length; i++) {
        result += (a[i].toUpperCase() + "<br>");

        result += (a[i].toLowerCase() + "<br>") ;
    }

    document.write(result);
</script>

</body>
</html>)
