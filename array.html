<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Splice</title>
</head>

<body>

<script>
    let a = new Array(1, 2, 3, 4, 5);

    a.splice(2, 1, 7, 8);
    for (let i = 0; i < a.length; i++) {
        document.write(a[i] + " ");
    }
</script>

</body>
</html>
